<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lavindeep</title>
  <meta name="description" content="Lavindeep. working towards something cool">
  <style>
    :root {
      color-scheme: dark;
      --fg: #e6edf3;
      --muted: #7d8590;
      --bg: #0a0d12;
      --accent: #5ce1ff;
      --cell: 48px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      text-align: center;
      font: 18px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--fg);
      background: var(--bg);
      overflow: hidden;
    }

    /* Grid drawn twice: a faint base layer, and a bright layer masked to a circle around the cursor. */
    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: var(--cell) var(--cell);
      background-position: center;
    }
    .grid.base { --line: rgba(92, 225, 255, .05); }
    .grid.lit {
      --line: rgba(92, 225, 255, .45);
      -webkit-mask-image: radial-gradient(circle 260px at var(--x, 50vw) var(--y, 50vh), #000 0%, transparent 100%);
      mask-image: radial-gradient(circle 260px at var(--x, 50vw) var(--y, 50vh), #000 0%, transparent 100%);
    }
    @media (hover: none) { .grid.lit { display: none; } }

    main { position: relative; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .25rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; }
    .social { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 3rem; }
    h2 { font-size: .8rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .75rem; }
    .projects li { color: var(--muted); }

    /* Links: accent underline slides in from the left, text shifts to accent. */
    a {
      position: relative;
      color: var(--fg);
      text-decoration: none;
      transition: color .2s ease;
    }
    a::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -2px;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }
    a:hover, a:focus-visible { color: var(--accent); outline: none; }
    a:hover::after, a:focus-visible::after { transform: scaleX(1); }

    /* Staggered fade-up on load. */
    main > * {
      opacity: 0;
      transform: translateY(8px);
      animation: rise .6s ease-out forwards;
    }
    main > :nth-child(1) { animation-delay: .1s; }
    main > :nth-child(2) { animation-delay: .25s; }
    main > :nth-child(3) { animation-delay: .4s; }
    main > :nth-child(4) { animation-delay: .55s; }
    main > :nth-child(5) { animation-delay: .7s; }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      main > * { animation: none; opacity: 1; transform: none; }
      a, a::after { transition: none; }
    }
  </style>
</head>
<body>
  <div class="grid base" aria-hidden="true"></div>
  <div class="grid lit" aria-hidden="true"></div>
  <main>
    <h1>Lavindeep</h1>
    <p>working towards something cool</p>
    <ul class="social">
      <li><a href="https://github.com/lavindeep">GitHub</a></li>
      <li><a href="https://x.com/Genuis_1">X</a></li>
      <li><a href="https://www.linkedin.com/in/lavindeep-dhillon/">LinkedIn</a></li>
    </ul>
    <h2>Projects</h2>
    <ul class="projects">
      <li>work in progress ;)</li>
    </ul>
  </main>
  <script>
    // Move the mask center to the pointer. Batched to one update per frame.
    if (matchMedia('(hover: hover)').matches) {
      const lit = document.querySelector('.grid.lit');
      let x = 0, y = 0, queued = false;
      addEventListener('pointermove', e => {
        x = e.clientX; y = e.clientY;
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => {
          lit.style.setProperty('--x', x + 'px');
          lit.style.setProperty('--y', y + 'px');
          queued = false;
        });
      }, { passive: true });
    }
  </script>
</body>
</html>

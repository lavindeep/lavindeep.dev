<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lavindeep Dhillon</title>
  <meta name="description" content="Lavindeep Dhillon. I build open source tools.">
  <style>
    :root {
      color-scheme: light dark;
      --fg: #111;
      --muted: #666;
      --bg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #eee; --muted: #999; --bg: #111; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 18px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    main { padding: 2rem; max-width: 32rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .25rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    nav { display: flex; gap: 1.5rem; }
    a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--muted); }
    a:hover { border-color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>Lavindeep Dhillon</h1>
    <p>I build open source tools.</p>
    <nav>
      <a href="https://github.com/lavindeep">GitHub</a>
      <a href="https://x.com/Genuis_1">X</a>
    </nav>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lavindeep</title>
  <meta name="description" content="Lavindeep. I build small tools and put them on GitHub.">
  <style>
    :root {
      color-scheme: dark;
      --fg: #eee;
      --muted: #888;
      --bg: #111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      font: 18px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    main { padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .25rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; }
    .social { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 3rem; }
    h2 { font-size: .8rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .75rem; }
    .projects li { color: var(--muted); }
    a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--muted); }
    a:hover { border-color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>Lavindeep</h1>
    <p>I build small tools and put them on GitHub.</p>
    <ul class="social">
      <li><a href="https://github.com/lavindeep">GitHub</a></li>
      <li><a href="https://x.com/Genuis_1">X</a></li>
      <li><a href="https://www.linkedin.com/in/lavindeep-dhillon/">LinkedIn</a></li>
    </ul>
    <h2>Projects</h2>
    <ul class="projects">
      <li>work in progress ;)</li>
    </ul>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lavindeep</title>
  <meta name="description" content="Lavindeep. working towards something cool">
  <style>
    :root {
      color-scheme: dark;
      --fg: #fafafa;
      --muted: #a3a3a3;
      --bg: #050505;
      --accent: #5ce1ff;
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      display: grid;
      grid-template-columns: 100%;
      place-items: center;
      text-align: center;
      font: 16px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      color: var(--fg);
      background: var(--bg);
    }

    /* Light-cycle trails drawn behind the content. */
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: .55;
    }

    main { position: relative; width: min(100%, 36rem); padding: 2rem 1.5rem; }
    h1 { font-size: clamp(1.5rem, 6vw, 2rem); font-weight: 600; letter-spacing: .04em; margin: 0 0 .5rem; }
    p { margin: 0 0 2rem; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; }
    .social { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem 1.5rem; }
    hr { width: 2.5rem; margin: 2.5rem auto; border: 0; border-top: 1px solid #2a2a2a; }
    h2 { font-size: 1rem; font-weight: 600; margin: 0 0 .5rem; }
    .projects li { color: var(--muted); }

    /* Links: accent underline slides in from the left, text shifts to accent. */
    a {
      position: relative;
      color: var(--fg);
      text-decoration: none;
      transition: color .2s ease;
    }
    a::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -2px;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }
    a:hover, a:focus-visible { color: var(--accent); outline: none; }
    a:hover::after, a:focus-visible::after { transform: scaleX(1); }

    /* Staggered fade-up on load. */
    main > * {
      opacity: 0;
      transform: translateY(8px);
      animation: rise .6s ease-out forwards;
    }
    main > :nth-child(1) { animation-delay: .1s; }
    main > :nth-child(2) { animation-delay: .25s; }
    main > :nth-child(3) { animation-delay: .4s; }
    main > :nth-child(4) { animation-delay: .55s; }
    main > :nth-child(5) { animation-delay: .7s; }
    main > :nth-child(6) { animation-delay: .85s; }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      canvas { display: none; }
      main > * { animation: none; opacity: 1; transform: none; }
      a, a::after { transition: none; }
    }
  </style>
</head>
<body>
  <canvas aria-hidden="true"></canvas>
  <main>
    <h1>Lavindeep</h1>
    <p>working towards something cool</p>
    <h2>Projects</h2>
    <ul class="projects">
      <li>work in progress ;)</li>
    </ul>
    <hr>
    <ul class="social">
      <li><a href="https://github.com/lavindeep">GitHub</a></li>
      <li><a href="https://x.com/Genuis_1">X</a></li>
      <li><a href="https://www.linkedin.com/in/lavindeep-dhillon/">LinkedIn</a></li>
    </ul>
  </main>

  <script>
    // Light cycles: a few lines enter from the edges, turn in 45 or 90 degree steps,
    // and leave a trail that fades with distance from the head.
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const GRID = 40, SPEED = 240, TRAIL = 320, COUNT = 3, RGB = '92,225,255';
      const R = Math.SQRT1_2;
      const DIRS = [[1, 0], [R, R], [0, 1], [-R, R], [-1, 0], [-R, -R], [0, -1], [R, -R]];
      const canvas = document.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const main = document.querySelector('main');
      let W, H, zone;

      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const r = main.getBoundingClientRect(), pad = 32;
        zone = { l: r.left - pad, r: r.right + pad, t: r.top - pad, b: r.bottom + pad };
      }

      // Keep the head out of the text block. A direction is clear if the next half cell and full cell stay outside.
      const inZone = (x, y) => x > zone.l && x < zone.r && y > zone.t && y < zone.b;
      function clear(c, d) {
        const [dx, dy] = DIRS[d];
        return !inZone(c.x + dx * GRID / 2, c.y + dy * GRID / 2) && !inZone(c.x + dx * GRID, c.y + dy * GRID);
      }
      function turn(c, options) {
        const ok = options.map(t => (c.d + t) % 8).filter(d => clear(c, d));
        c.corners.push({ x: c.x, y: c.y });
        c.d = ok.length ? ok[Math.floor(Math.random() * ok.length)] : (c.d + 4) % 8;
        c.untilTurn = runLength();
      }

      const runLength = () => GRID * (2 + Math.floor(Math.random() * 6));

      function spawn() {
        const edge = Math.floor(Math.random() * 4);
        const x = edge === 0 ? 0 : edge === 2 ? W : Math.random() * W;
        const y = edge === 1 ? 0 : edge === 3 ? H : Math.random() * H;
        const d = (edge * 2 + [7, 0, 1][Math.floor(Math.random() * 3)]) % 8;
        return { x, y, d, corners: [{ x, y }], untilTurn: runLength(), delay: 1 + Math.random() * 4 };
      }

      function step(c, dt) {
        if (c.delay > 0) { c.delay -= dt; return; }
        const dist = SPEED * dt;
        c.x += DIRS[c.d][0] * dist;
        c.y += DIRS[c.d][1] * dist;
        c.untilTurn -= dist;
        if (!clear(c, c.d)) turn(c, [1, 2, 3, 5, 6, 7]);
        else if (c.untilTurn <= 0) turn(c, [1, 2, 6, 7]);
        const off = TRAIL + GRID;
        if (c.x < -off || c.x > W + off || c.y < -off || c.y > H + off) Object.assign(c, spawn());
      }

      function draw(c) {
        if (c.delay > 0) return;
        ctx.lineWidth = 1;
        let remaining = TRAIL;
        let hx = c.x, hy = c.y;
        for (let i = c.corners.length - 1; i >= 0 && remaining > 0; i--) {
          const p = c.corners[i];
          const len = Math.hypot(hx - p.x, hy - p.y);
          const t = Math.min(1, remaining / len);
          const ex = hx + (p.x - hx) * t, ey = hy + (p.y - hy) * t;
          const g = ctx.createLinearGradient(hx, hy, ex, ey);
          g.addColorStop(0, `rgba(${RGB},${remaining / TRAIL})`);
          g.addColorStop(1, `rgba(${RGB},${Math.max(0, (remaining - len) / TRAIL)})`);
          ctx.strokeStyle = g;
          ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, ey); ctx.stroke();
          remaining -= len;
          hx = p.x; hy = p.y;
          if (remaining <= 0) c.corners.splice(0, i);
        }
        ctx.fillStyle = `rgba(${RGB},1)`;
        ctx.shadowColor = `rgba(${RGB},.9)`;
        ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(c.x, c.y, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }

      resize();
      addEventListener('resize', resize);
      const cycles = Array.from({ length: COUNT }, spawn);
      let last = performance.now();
      (function frame(now) {
        const dt = Math.min((now - last) / 1000, .05);
        last = now;
        ctx.clearRect(0, 0, W, H);
        for (const c of cycles) { step(c, dt); draw(c); }
        requestAnimationFrame(frame);
      })(last);
    }
  </script>
</body>
</html>

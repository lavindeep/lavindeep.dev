<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lavindeep</title>
  <meta name="description" content="Lavindeep. working towards something cool">
  <style>
    :root {
      color-scheme: dark;
      --fg: #e6edf3;
      --muted: #7d8590;
      --bg: #0a0d12;
      --accent: #5ce1ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      text-align: center;
      font: 18px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--fg);
      background: var(--bg);
      overflow: hidden;
    }

    /* Blurred accent disc that trails the cursor. Blur gives a smooth falloff with no banding. */
    .glow {
      position: fixed;
      top: 0; left: 0;
      width: 40vmax; height: 40vmax;
      margin: -20vmax 0 0 -20vmax;
      border-radius: 50%;
      background: var(--accent);
      opacity: .14;
      filter: blur(90px);
      pointer-events: none;
      transform: translate3d(var(--x, 50vw), var(--y, 50vh), 0);
      transition: transform .9s cubic-bezier(.2, .8, .2, 1);
      will-change: transform;
    }
    /* No cursor to follow: breathe in place instead. */
    @media (hover: none) {
      .glow { animation: breathe 8s ease-in-out infinite; }
    }
    @keyframes breathe {
      0%, 100% { opacity: .1; }
      50%      { opacity: .18; }
    }

    main { position: relative; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .25rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; }
    .social { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 3rem; }
    h2 { font-size: .8rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .75rem; }
    .projects li { color: var(--muted); }

    /* Links: accent underline slides in from the left, text shifts to accent. */
    a {
      position: relative;
      color: var(--fg);
      text-decoration: none;
      transition: color .2s ease;
    }
    a::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -2px;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }
    a:hover, a:focus-visible { color: var(--accent); outline: none; }
    a:hover::after, a:focus-visible::after { transform: scaleX(1); }

    /* Staggered fade-up on load. */
    main > * {
      opacity: 0;
      transform: translateY(8px);
      animation: rise .6s ease-out forwards;
    }
    main > :nth-child(1) { animation-delay: .1s; }
    main > :nth-child(2) { animation-delay: .25s; }
    main > :nth-child(3) { animation-delay: .4s; }
    main > :nth-child(4) { animation-delay: .55s; }
    main > :nth-child(5) { animation-delay: .7s; }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow { animation: none; transition: none; }
      main > * { animation: none; opacity: 1; transform: none; }
      a, a::after { transition: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <h1>Lavindeep</h1>
    <p>working towards something cool</p>
    <ul class="social">
      <li><a href="https://github.com/lavindeep">GitHub</a></li>
      <li><a href="https://x.com/Genuis_1">X</a></li>
      <li><a href="https://www.linkedin.com/in/lavindeep-dhillon/">LinkedIn</a></li>
    </ul>
    <h2>Projects</h2>
    <ul class="projects">
      <li>work in progress ;)</li>
    </ul>
  </main>
  <script>
    // Glow follows the pointer on hover-capable devices. The CSS transition does the easing.
    if (matchMedia('(hover: hover)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const glow = document.querySelector('.glow');
      addEventListener('pointermove', e => {
        glow.style.setProperty('--x', e.clientX + 'px');
        glow.style.setProperty('--y', e.clientY + 'px');
      }, { passive: true });
    }
  </script>
</body>
</html>

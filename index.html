<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lavindeep</title>
  <meta name="description" content="Lavindeep. working towards something cool">
  <style>
    :root {
      color-scheme: dark;
      --fg: #eee;
      --muted: #888;
      --bg: #111;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      font: 18px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--fg);
      background: var(--bg);
      overflow-x: hidden;
    }

    /* Soft glow behind the content that slowly breathes. Only transform and opacity animate. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.06), transparent 40%);
      animation: breathe 9s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { opacity: .6; transform: scale(1); }
      50%      { opacity: 1;  transform: scale(1.12); }
    }

    main { position: relative; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .25rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; }
    .social { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 3rem; }
    h2 { font-size: .8rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .75rem; }
    .projects li { color: var(--muted); }

    /* Links: underline slides in from the left on hover. */
    a {
      position: relative;
      color: var(--fg);
      text-decoration: none;
      transition: color .2s ease;
    }
    a::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: -2px;
      height: 1px;
      background: var(--fg);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
    }
    a:hover::after, a:focus-visible::after { transform: scaleX(1); }

    /* Staggered fade-up on load. */
    main > * {
      opacity: 0;
      transform: translateY(8px);
      animation: rise .6s ease-out forwards;
    }
    main > :nth-child(1) { animation-delay: .1s; }
    main > :nth-child(2) { animation-delay: .25s; }
    main > :nth-child(3) { animation-delay: .4s; }
    main > :nth-child(4) { animation-delay: .55s; }
    main > :nth-child(5) { animation-delay: .7s; }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      main > * { animation: none; opacity: 1; transform: none; }
      a, a::after { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Lavindeep</h1>
    <p>working towards something cool</p>
    <ul class="social">
      <li><a href="https://github.com/lavindeep">GitHub</a></li>
      <li><a href="https://x.com/Genuis_1">X</a></li>
      <li><a href="https://www.linkedin.com/in/lavindeep-dhillon/">LinkedIn</a></li>
    </ul>
    <h2>Projects</h2>
    <ul class="projects">
      <li>work in progress ;)</li>
    </ul>
  </main>
</body>
</html>
